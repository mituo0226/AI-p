<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI PAR｜LOVEパートナー - あなたに最適なAIキャラクター</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      line-height: 1.6;
      color: #333;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 15px;
    }

    /* Header */
    .header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #333;
    }

    .logo img {
      height: 40px;
      width: auto;
    }

    .logo-text {
      font-size: 20px;
      font-weight: bold;
      background: linear-gradient(45deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav a {
      text-decoration: none;
      color: #333;
      padding: 8px 15px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.8);
      transition: all 0.3s ease;
      font-weight: 500;
      font-size: 14px;
      white-space: nowrap;
    }

    .nav a:hover {
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white;
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
    }

    /* Hero Section */
    .hero {
      text-align: center;
      color: white;
      margin-bottom: 30px;
      padding: 20px 0;
    }

    .hero h1 {
      font-size: 2.2rem;
      margin-bottom: 15px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      line-height: 1.2;
    }

    .hero p {
      font-size: 1rem;
      margin-bottom: 25px;
      opacity: 0.9;
      line-height: 1.5;
    }

    .cta-button {
      display: inline-block;
      background: linear-gradient(45deg, #ff6b6b, #ee5a24);
      color: white;
      padding: 12px 30px;
      border-radius: 25px;
      text-decoration: none;
      font-size: 1rem;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      min-width: 200px;
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }



    /* Character Preview */
    .character-preview {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 25px 20px;
      margin-bottom: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .character-preview h2 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 20px;
      color: #333;
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .character-item {
      text-align: center;
      padding: 15px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.8);
      transition: all 0.3s ease;
    }

    .character-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    }

    .character-item img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 8px;
      border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .character-item h4 {
      font-size: 0.9rem;
      margin-bottom: 4px;
      color: #333;
    }

    .character-item p {
      font-size: 0.8rem;
      color: #666;
      line-height: 1.3;
    }

    .view-all-button {
      display: block;
      text-align: center;
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white;
      padding: 12px 30px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      max-width: 180px;
      margin: 0 auto;
      font-size: 0.95rem;
    }

    .view-all-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    /* Footer */
    .footer {
      text-align: center;
      color: white;
      padding: 20px 0;
      opacity: 0.8;
      font-size: 0.9rem;
    }

    /* Tablet Styles */
    @media (min-width: 768px) {
      .container {
        padding: 20px;
      }

      .hero h1 {
        font-size: 2.8rem;
      }

      .hero p {
        font-size: 1.1rem;
      }



      .character-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }

      .character-item img {
        width: 70px;
        height: 70px;
      }

      .nav a {
        padding: 10px 20px;
        font-size: 15px;
      }
    }

    /* Desktop Styles */
    @media (min-width: 1024px) {
      .hero h1 {
        font-size: 3rem;
      }

      .hero p {
        font-size: 1.2rem;
      }

      .character-grid {
        grid-template-columns: repeat(6, 1fr);
        gap: 20px;
      }

      .character-item img {
        width: 80px;
        height: 80px;
      }

      .feature-card {
        padding: 30px;
      }

      .character-preview {
        padding: 40px;
      }
    }

    /* Small Mobile Optimization */
    @media (max-width: 375px) {
      .container {
        padding: 10px;
      }

      .hero h1 {
        font-size: 1.8rem;
      }

      .hero p {
        font-size: 0.9rem;
      }

      .nav {
        gap: 5px;
      }

      .nav a {
        padding: 6px 12px;
        font-size: 13px;
      }

      .character-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .character-item {
        padding: 12px 8px;
      }

      .character-item img {
        width: 50px;
        height: 50px;
      }

      .character-item h4 {
        font-size: 0.8rem;
      }

      .character-item p {
        font-size: 0.75rem;
      }
    }

    /* Landscape Mobile */
    @media (max-height: 500px) and (orientation: landscape) {
      .hero {
        margin-bottom: 20px;
        padding: 15px 0;
      }

      .hero h1 {
        font-size: 1.8rem;
        margin-bottom: 10px;
      }

      .hero p {
        margin-bottom: 15px;
      }



      .character-preview {
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <a href="./index.html" class="logo">
          <img src="./ga/image/material/rogo.png" alt="AI PAR ロゴ">
          <span class="logo-text">AI PAR</span>
        </a>
        <nav class="nav">
          <a href="./index.html">トップ</a>
          <a href="./prof.html">一覧</a>
          <a href="./matching.html">診断</a>
          <a href="./questionnaire.html">アンケート</a>
        </nav>
      </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
      <h1>あなたに最適なAIパートナー</h1>
      <p>20人の魅力的なキャラクターから、あなたの理想のパートナーを見つけましょう</p>
      <a href="./matching.html" class="cta-button">診断を始める</a>
    </section>



    <!-- Character Preview -->
    <section class="character-preview">
      <h2>キャラクター紹介</h2>
      <div class="character-grid">
        <div class="character-item">
          <img src="./ga/image/character/asakura.png" alt="朝倉">
          <h4>朝倉</h4>
          <p>明るく元気</p>
        </div>
        <div class="character-item">
          <img src="./ga/image/character/honoka.png" alt="ほのか">
          <h4>ほのか</h4>
          <p>優しく思いやり深い</p>
        </div>
        <div class="character-item">
          <img src="./ga/image/character/runa.png" alt="ルナ">
          <h4>ルナ</h4>
          <p>クールで知的</p>
        </div>
        <div class="character-item">
          <img src="./ga/image/character/ryo.png" alt="リョウ">
          <h4>リョウ</h4>
          <p>頼りになる兄貴分</p>
        </div>
        <div class="character-item">
          <img src="./ga/image/character/mariko.png" alt="マリコ">
          <h4>マリコ</h4>
          <p>大人な魅力</p>
        </div>
        <div class="character-item">
          <img src="./ga/image/character/nana.png" alt="ナナ">
          <h4>ナナ</h4>
          <p>可愛らしい妹系</p>
        </div>
      </div>
      <a href="./prof.html" class="view-all-button">全キャラクターを見る</a>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p>&copy; <span id="current-year"></span> AI PAR - LOVEパートナー. All rights reserved.</p>
    </footer>
  </div>

  <script>
    // 現在の年を表示
    document.getElementById('current-year').textContent = new Date().getFullYear();
    
    // スムーズスクロール
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        document.querySelector(this.getAttribute('href')).scrollIntoView({
          behavior: 'smooth'
        });
      });
    });

    // モバイルでのタッチ操作を改善
    document.addEventListener('DOMContentLoaded', function() {
      // タッチデバイスでのホバー効果を無効化
      if ('ontouchstart' in window) {
        const touchElements = document.querySelectorAll('.feature-card, .character-item, .nav a, .cta-button, .view-all-button');
        touchElements.forEach(element => {
          element.style.transition = 'none';
        });
      }
    });
  </script>
</body>
</html>
