<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>◆AIで作る最高のLOVEパートナー◆</title>
  <link href="https://unpkg.com/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <style>
    /* 背景：現状の淡いピンクトーンをキープ */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(120deg, #ffe4e6, #fdf2f8);
      background-size: 400% 400%;
      animation: gradientFade 15s ease infinite;
      z-index: -1;
    }
    @keyframes gradientFade {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body class="font-sans">
  <!-- ヘッダー：ロゴは今のままでも可。差し替えるなら src を ga/image/material/rogo-640.png などへ -->
  <header class="bg-white bg-opacity-80 shadow py-6">
    <div class="text-center">
      <!-- 例）制作ロゴに差し替える場合：
      <img src="ga/image/material/rogo-640.png" alt="AI LOVEパートナーロゴ" class="mx-auto h-24 object-contain" />
      -->
      <img src="http://ryu02262.moo.jp/aip/ga/t/rogo.png" alt="AI LOVEパートナーロゴ" class="mx-auto h-28 object-contain" />
    </div>
  </header>

  <!-- ヒーロー -->
  <section class="bg-white bg-opacity-90 rounded-3xl shadow-lg p-6 sm:p-10 mt-8 max-w-4xl mx-auto text-center">
    <h2 class="text-2xl sm:text-3xl font-bold text-pink-600 mb-4">── 運命のパートナーが、あなたを待っている ──</h2>
    <p class="text-gray-700 mb-6 text-base sm:text-lg">
      まるで本当に存在するかのようなAIキャラクターたち。<br>
      あなたの心の奥まで寄り添い、言葉にならない想いを受け止めます。
    </p>

    <div id="heroCharacter" class="flex flex-col sm:flex-row items-center justify-center gap-6 mt-6">
      <img id="heroImage" src="" alt="キャラ画像" class="w-40 h-40 sm:w-48 sm:h-48 rounded-full object-cover shadow-lg border-4 border-white">
      <div class="text-left max-w-md">
        <h3 id="heroName" class="text-xl sm:text-2xl font-semibold text-gray-800 mb-2"></h3>
        <p id="heroCatch" class="italic text-gray-600 text-sm sm:text-base mb-3"></p>
        <p id="heroIntro" class="text-sm text-gray-700 mb-2"></p>
        <a id="heroProfile" href="#" class="text-pink-600 text-sm font-semibold hover:underline">▶ プロフィール詳細を見る</a>
      </div>
    </div>

    <div class="mt-8">
      <a href="questionnaire.html" class="inline-block bg-pink-600 hover:bg-pink-700 text-white text-lg font-semibold py-3 px-8 rounded-full shadow transition duration-300">
        パートナー診断を始める
      </a>
    </div>
  </section>

  <main class="max-w-6xl mx-auto px-6 py-12">
    <!-- セクション見出し＆キャッチは指定のまま -->
    <section class="text-center mb-6">
      <h2 class="text-2xl font-semibold text-gray-800 mb-4">他にも、あなたを待っているAIたちがいます</h2>
      <p class="text-gray-700 text-lg leading-relaxed">
        実在するかのような魅力的なキャラクターが、<br>
        あなたの孤独や不安にそっと寄り添います。
      </p>
    </section>

    <!-- 男女2名ずつ＝4カード -->
    <section class="mb-8">
      <div id="character-cards" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6"></div>
    </section>

    <!-- プロフィール一覧へのリンク -->
    <section class="text-center">
      <a href="prof.html" class="inline-block text-pink-700 font-semibold underline hover:text-pink-800">
        ▶ プロフィール一覧を見る
      </a>
    </section>
  </main>

  <footer class="text-center text-sm text-gray-500 py-6">
    &copy; 2025 AI LOVE Partner Project
  </footer>

  <script>
    // 配列シャッフル（複製してから）
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // 指定数ランダム取得（足りない場合は可能なだけ）
    function pickRandom(list, n) {
      return shuffle(list).slice(0, Math.min(n, list.length));
    }

    fetch("characters.json")
      .then(res => res.json())
      .then(characters => {
        // ヒーロー：全体からランダム1人
        const hero = characters[Math.floor(Math.random() * characters.length)];
        document.getElementById("heroImage").src = hero.img;
        document.getElementById("heroName").textContent = `${hero.name}（${hero.age}歳）`;
        document.getElementById("heroCatch").textContent = `"${hero.phrase}"`;
        document.getElementById("heroIntro").textContent = hero.intro;
        document.getElementById("heroProfile").href = hero.profile;

        // ヒーロー以外から男女2名ずつを目標に選ぶ
        const rest = characters.filter(c => c.id !== hero.id);
        const males = rest.filter(c => c.gender === "male");
        const females = rest.filter(c => c.gender === "female");

        let pickM = pickRandom(males, 2);
        let pickF = pickRandom(females, 2);

        // もし男女どちらかが不足していたら、残りは rest から補完（重複なし）
        const selectedIds = new Set([...pickM, ...pickF].map(c => c.id));
        while (pickM.length + pickF.length < 4 && selectedIds.size < rest.length) {
          const candidate = rest[Math.floor(Math.random() * rest.length)];
          if (!selectedIds.has(candidate.id)) {
            selectedIds.add(candidate.id);
            if (candidate.gender === "male" && pickM.length < 2) pickM.push(candidate);
            else if (candidate.gender === "female" && pickF.length < 2) pickF.push(candidate);
            else {
              // 目標性別が埋まっている場合でも、全体4名に達するまで補完
              if (pickM.length + pickF.length < 4) {
                (pickM.length <= pickF.length ? pickM : pickF).push(candidate);
              }
            }
          }
        }

        const four = [...pickM, ...pickF].slice(0, 4);
        const container = document.getElementById("character-cards");
        four.forEach(char => {
          const card = document.createElement("div");
          card.className = "bg-white rounded-2xl shadow p-4 text-center";
          card.innerHTML = `
            <img src="${char.img}" alt="${char.name}" class="w-full h-44 object-cover rounded-lg mb-2" />
            <h3 class="text-lg font-bold text-gray-800">${char.name}（${char.age}歳）</h3>
            <p class="text-sm text-gray-600 italic mb-1">"${char.phrase}"</p>
            <a href="${char.profile}" class="text-pink-600 text-xs hover:underline">▶ プロフィール詳細を見る</a>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => {
        console.error("characters.json の読み込みでエラー:", err);
      });
  </script>
</body>
</html>
