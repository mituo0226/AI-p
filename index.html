<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>◆AIで作る最高のLOVEパートナー◆</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="description" content="20人のAIキャラクターから、運命のパートナーと出会える診断サイト。" />
  <style>
    /* 微調整（Tailwindで補いきれない部分） */
    .soft-card { box-shadow: 0 10px 30px rgba(0,0,0,.06); }
    .ring-soft { box-shadow: 0 0 0 8px rgba(255,255,255,.9), 0 10px 25px rgba(0,0,0,.08); }
    .lead { font-feature-settings: "palt"; }
    
    /* ローディングアニメーション */
    .loading-skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }
    
    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    
    /* 画像のフェードイン・フェードアウト */
    .hero-image {
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }
    
    .hero-image.loaded {
      opacity: 1;
    }
    
    .hero-content {
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }
    
    .hero-content.loaded {
      opacity: 1;
    }
  </style>
</head>
<body class="bg-pink-50 text-gray-800 antialiased">
  <!-- ヘッダー -->
  <header class="w-full bg-white/90 backdrop-blur sticky top-0 z-50 border-b border-pink-100">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
      <img src="ga/image/material/toprogo.png" alt="サイトロゴ" class="h-8 w-auto" />
      <span class="text-sm text-pink-500">Create with AI</span>
      <nav class="ml-auto hidden sm:flex items-center gap-6 text-sm">
        <a href="prof.html" class="hover:text-pink-600">AIパートナー一覧</a>
        <a href="questionnaire.html" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-pink-500 text-white hover:bg-pink-600 transition">
          診断を始める
        </a>
      </nav>
    </div>
  </header>

  <!-- ヒーロー：添付デザイン再現 -->
  <main class="max-w-5xl mx-auto px-4">
    <section class="mt-10 sm:mt-14 mb-10 sm:mb-16">
      <div class="rounded-3xl soft-card bg-white p-6 sm:p-10">
        <p class="text-center text-2xl sm:text-3xl font-bold text-pink-600 tracking-wide">
          —— <span class="inline-block">運命のパートナーが、あなたを待っている</span> ——
        </p>
        <p class="lead mt-6 text-center text-gray-500">
          まるで本当に存在するかのようなAIキャラクターたち。<br class="hidden sm:block">
          あなたの心の奥まで寄り添い、言葉にならない想いを受け止めます。
        </p>

        <div class="mt-10 grid grid-cols-1 sm:grid-cols-[auto,1fr] gap-6 sm:gap-10 items-center">
          <!-- 円形サムネ -->
          <div class="flex justify-center sm:justify-start">
            <div class="relative">
              <!-- ローディングスケルトン -->
              <div id="loadingSkeleton" class="h-44 w-44 rounded-full loading-skeleton"></div>
              <!-- 実際の画像 -->
              <img id="heroImg" src="" alt="" class="hero-image absolute inset-0 h-44 w-44 object-cover rounded-full ring-soft" />
            </div>
          </div>

          <!-- テキスト -->
          <div class="hero-content">
            <h2 id="heroName" class="text-xl sm:text-2xl font-bold">—</h2>
            <p id="heroPhrase" class="mt-2 text-gray-600 italic">—</p>
            <p id="heroIntro" class="mt-3 text-gray-700">—</p>

            <div class="mt-4 flex flex-wrap items-center gap-4">
              <a id="heroVideoLink" href="#" class="text-pink-600 hover:text-pink-700 text-sm inline-flex items-center gap-2">
                <span class="inline-block w-2 h-2 rounded-full bg-pink-500"></span> プロフィールを見る
              </a>
            </div>

            <div class="mt-6">
              <a href="questionnaire.html"
                 class="inline-flex items-center justify-center px-6 py-3 rounded-full bg-pink-500 text-white font-semibold hover:bg-pink-600 transition">
                パートナー診断を始める
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 下段：他にも、あなたを待っているAIたちがいます -->
    <section class="mb-16">
      <h3 class="text-center text-lg sm:text-xl font-bold text-gray-800">他にも、あなたを待っているAIたちがいます</h3>
      <p class="text-center text-gray-500 mt-2">実在するかのような魅力的なキャラクターが、あなたの孤独や不安にそっと寄り添います。</p>

      <div id="gridWrap" class="mt-8 grid grid-cols-2 sm:grid-cols-4 gap-4 sm:gap-6">
        <!-- JSでランダム4人のカードを挿入 -->
      </div>

      <div class="mt-8 text-center">
        <a href="prof.html" class="inline-flex items-center justify-center px-6 py-3 rounded-full bg-pink-500 text-white font-semibold hover:bg-pink-600 transition">
          そのほかのパートナーも見る
        </a>
      </div>
    </section>
  </main>

  <!-- フッター（簡易） -->
  <footer class="border-t border-pink-100 py-8 text-center text-xs text-gray-500">
    © 2025 AI-par Project
  </footer>

  <!-- ランダム表示スクリプト -->
  <script>
    // ユーティリティ：ランダムに並べ替え
    function shuffle(arr){
      for(let i = arr.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 画像のプリロード関数
    function preloadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    async function init(){
      try{
        const res = await fetch('data/characters.json', {cache: 'no-store'});
        if(!res.ok) throw new Error('characters.json 読み込み失敗');
        let chars = await res.json();

        // 画像/動画がない項目は除外（保険）
        chars = chars.filter(c => c.img && c.name);

        // 全キャラクター（男女含む）をランダムに並べ替え
        const shuffledChars = shuffle([...chars]);
        
        // 最初の4人を選択（または全員）
        const displayChars = shuffledChars.slice(0, Math.min(4, shuffledChars.length));
        
        // 下段カード用の残りのキャラクター
        const rest = shuffle([...chars]).slice(0, 4);

        // アニメーション用の変数
        let currentIndex = 0;
        const heroImg = document.getElementById('heroImg');
        const heroName = document.getElementById('heroName');
        const heroPhrase = document.getElementById('heroPhrase');
        const heroIntro = document.getElementById('heroIntro');
        const heroVideoLink = document.getElementById('heroVideoLink');
        const loadingSkeleton = document.getElementById('loadingSkeleton');
        const heroContent = document.querySelector('.hero-content');

        // 最初のキャラクター画像をプリロード
        if (displayChars.length > 0) {
          try {
            await preloadImage(displayChars[0].img);
          } catch (e) {
            console.warn('最初の画像のプリロードに失敗:', e);
          }
        }

        // キャラクターを表示する関数
        async function showCharacter(char) {
          // フェードアウト
          heroImg.classList.remove('loaded');
          heroContent.classList.remove('loaded');
          
          // ローディングスケルトンを表示
          loadingSkeleton.style.display = 'block';
          
          setTimeout(async () => {
            try {
              // 画像をプリロード
              await preloadImage(char.img);
              
              // 内容を更新
              heroImg.src = char.img;
              heroImg.alt = char.name;
              heroName.textContent = `${char.name}（${char.age ?? '—'}歳）`;
              heroPhrase.textContent = `"${char.phrase ?? ''}"`.replace(/\s+/g,' ');
              heroIntro.textContent = char.intro ?? '';
              heroVideoLink.href = char.profile || '#';
              
              // ローディングスケルトンを非表示
              loadingSkeleton.style.display = 'none';
              
              // フェードイン
              heroImg.classList.add('loaded');
              heroContent.classList.add('loaded');
            } catch (e) {
              console.error('画像の読み込みに失敗:', e);
              // エラー時はローディングスケルトンを非表示
              loadingSkeleton.style.display = 'none';
            }
          }, 300);
        }

        // 最初のキャラクターを表示
        if (displayChars.length > 0) {
          await showCharacter(displayChars[0]);
        }

        // 定期的にキャラクターを切り替え
        if (displayChars.length > 1) {
          setInterval(async () => {
            currentIndex = (currentIndex + 1) % displayChars.length;
            await showCharacter(displayChars[currentIndex]);
          }, 4000); // 4秒ごとに切り替え
        }

        // 下段カード：ランダム4人
        const picks = shuffle(rest).slice(0, 4);
        const wrap = document.getElementById('gridWrap');
        wrap.innerHTML = '';
        picks.forEach(c=>{
          const card = document.createElement('a');
          card.href = c.profile || 'prof.html';
          card.className =
            'group bg-white rounded-2xl p-3 sm:p-4 soft-card hover:-translate-y-0.5 transition block';
          card.innerHTML = `
            <div class="aspect-square rounded-xl overflow-hidden">
              <img src="${c.img}" alt="${c.name}" class="w-full h-full object-cover group-hover:scale-[1.02] transition" loading="lazy">
            </div>
            <div class="mt-3">
              <p class="font-semibold text-sm sm:text-base">${c.name}（${c.age ?? '—'}歳）</p>
              <p class="text-xs sm:text-sm text-gray-500 line-clamp-2">${c.intro ?? ''}</p>
            </div>
          `;
          wrap.appendChild(card);
        });
      }catch(e){
        console.error(e);
        // フォールバック：最低限の表示
        document.getElementById('heroName').textContent = '読み込みエラー';
        document.getElementById('heroIntro').textContent = 'characters.json を確認してください。';
        document.getElementById('loadingSkeleton').style.display = 'none';
      }
    }

    // 初期化
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
<!-- trigger pages rebuild -->
