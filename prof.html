<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI PAR｜キャラクター一覧 - あなたに最適なAIパートナーを見つけよう</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      line-height: 1.6;
      color: #333;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      overflow-x: hidden;
      width: 100%;
      position: relative;
    }

    .container {
      max-width: 100vw;
      width: 100%;
      margin: 0 auto;
      padding: 15px;
      overflow-x: hidden;
      box-sizing: border-box;
    }

    /* Header */
    .header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: #333;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 18px;
      font-weight: bold;
      background: linear-gradient(45deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav a {
      text-decoration: none;
      color: #333;
      padding: 6px 10px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.8);
      transition: all 0.3s ease;
      font-weight: 500;
      font-size: 12px;
      white-space: nowrap;
      min-width: 0;
    }

    .nav a:hover {
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white;
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
    }

    /* Main Content */
    .main-content {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 25px 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      overflow-x: hidden;
      width: 100%;
      box-sizing: border-box;
    }

    .hero-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .hero-section h1 {
      font-size: 2.2rem;
      margin-bottom: 15px;
      color: #333;
      background: linear-gradient(45deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-section p {
      font-size: 1rem;
      color: #666;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .characters-icon {
      font-size: 3.5rem;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
      animation: float 3s ease-in-out infinite;
    }

    .characters-icon span {
      display: inline-block;
      animation: bounce 2s ease-in-out infinite;
    }

    .characters-icon span:nth-child(1) {
      animation-delay: 0s;
    }

    .characters-icon span:nth-child(2) {
      animation-delay: 0.3s;
    }

    .characters-icon span:nth-child(3) {
      animation-delay: 0.6s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-15px); }
      60% { transform: translateY(-7px); }
    }

    /* キャラクターグリッド */
    .characters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
      width: 100%;
      box-sizing: border-box;
    }

    .character-card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      word-wrap: break-word;
      overflow-wrap: break-word;
      width: 100%;
      box-sizing: border-box;
    }

    .character-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(45deg, #667eea, #764ba2);
    }

    .character-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
    }

    .character-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .character-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #f0f0f0;
    }

    .character-info {
      flex: 1;
    }

    .character-name {
      font-size: 1.3rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
    }

    .character-age {
      font-size: 0.9rem;
      color: #666;
    }

    .character-description {
      color: #555;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .character-phrase {
      color: #667eea;
      font-style: italic;
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 15px;
      padding: 10px;
      background: rgba(102, 126, 234, 0.1);
      border-radius: 8px;
      border-left: 3px solid #667eea;
    }

    .character-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .character-tag {
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white;
      padding: 4px 12px;
      border-radius: 15px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .character-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 25px;
      text-decoration: none;
      text-align: center;
      font-weight: 600;
      transition: all 0.3s ease;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-primary {
      background: linear-gradient(45deg, #ff6b6b, #ee5a24);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
    }

    .btn-secondary {
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white;
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
    }

    /* Footer */
    .footer {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 30px 20px;
      margin-top: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .footer-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .footer-nav {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 20px;
    }

    .footer-nav a {
      text-decoration: none;
      color: #333;
      padding: 10px 20px;
      border-radius: 25px;
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white;
      transition: all 0.3s ease;
      font-weight: 500;
      font-size: 14px;
      white-space: nowrap;
    }

    .footer-nav a:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
    }

    .footer-info {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .footer-copyright {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(0, 0, 0, 0.1);
      color: #888;
      font-size: 0.8rem;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Responsive Design */
    @media (min-width: 768px) {
      .container {
        padding: 20px;
      }

      .hero-section h1 {
        font-size: 2.8rem;
      }

      .hero-section p {
        font-size: 1.1rem;
      }

      .characters-icon {
        font-size: 4rem;
        gap: 15px;
      }

      .characters-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 25px;
      }

      .nav a {
        padding: 10px 20px;
        font-size: 15px;
      }
    }

    @media (min-width: 1024px) {
      .hero-section h1 {
        font-size: 3rem;
      }

      .hero-section p {
        font-size: 1.2rem;
      }

      .characters-icon {
        font-size: 4.5rem;
        gap: 20px;
      }

      .main-content {
        padding: 40px;
      }

      .characters-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 10px;
        max-width: 100vw;
      }

      .main-content {
        padding: 20px 10px;
        width: 100%;
      }

      .hero-section h1 {
        font-size: 1.8rem;
        word-wrap: break-word;
      }

      .hero-section p {
        font-size: 0.9rem;
        word-wrap: break-word;
      }

      .characters-icon {
        font-size: 3rem;
        gap: 8px;
      }

      .characters-grid {
        grid-template-columns: 1fr;
        gap: 15px;
        width: 100%;
      }

      .character-header {
        flex-direction: column;
        text-align: center;
      }

      .character-avatar {
        width: 60px;
        height: 60px;
      }

      .character-card {
        padding: 15px 10px;
        width: 100%;
      }

      .nav {
        gap: 5px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .nav a {
        padding: 6px 12px;
        font-size: 13px;
        white-space: nowrap;
      }

      .logo {
        justify-content: center;
        margin-bottom: 8px;
      }
      
      .logo-text {
        font-size: 16px;
      }

      .header-content {
        flex-direction: column;
        align-items: center;
      }

      .footer {
        padding: 20px 15px;
        margin-top: 20px;
      }

      .footer-nav {
        gap: 10px;
      }

      .footer-nav a {
        padding: 8px 15px;
        font-size: 13px;
      }

      .footer-info {
        font-size: 0.85rem;
      }
    }

    @media (max-width: 375px) {
      .container {
        padding: 8px;
        max-width: 100vw;
      }

      .main-content {
        padding: 15px 8px;
        width: 100%;
      }

      .hero-section h1 {
        font-size: 1.6rem;
        word-wrap: break-word;
      }

      .hero-section p {
        font-size: 0.85rem;
        word-wrap: break-word;
      }

      .character-card {
        padding: 12px 8px;
        width: 100%;
      }

      .nav a {
        padding: 4px 8px;
        font-size: 12px;
      }

      .footer {
        padding: 15px 10px;
      }

      .footer-nav {
        gap: 8px;
      }

      .footer-nav a {
        padding: 6px 12px;
        font-size: 12px;
      }

      .footer-info {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <a href="./index.html" class="logo">
          <span class="logo-text">AI PARTNER</span>
        </a>
        <nav class="nav">
          <a href="./index.html">トップ</a>
          <a href="./prof.html">一覧</a>
          <a href="./matching.html">診断</a>
          <a href="./questionnaire.html">アンケート</a>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Hero Section -->
      <section class="hero-section">
        <div class="characters-icon">
          <span>💕</span>
          <span>✨</span>
          <span>🎀</span>
        </div>
        <h1>キャラクター一覧</h1>
        <p>20人の魅力的なAIキャラクターから、あなたに最適なパートナーを見つけましょう</p>
      </section>

      <!-- Characters Grid -->
      <section class="characters-grid" id="charactersGrid">
        <!-- キャラクターカードはJavaScriptで動的に生成 -->
        <div class="loading">
          <div class="loading-spinner"></div>
          <p>キャラクター情報を読み込み中...</p>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-content">
        <nav class="footer-nav">
          <a href="./index.html">🏠 トップページ</a>
          <a href="./prof.html">👥 キャラクター一覧</a>
          <a href="./matching.html">🔍 相性診断</a>
          <a href="./questionnaire.html">📝 アンケート</a>
          <a href="./chat.html">💬 チャット</a>
        </nav>
        
        <div class="footer-info">
          <p>AI PAR - あなたに最適なAIパートナーを見つけよう</p>
          <p>20人の魅力的なキャラクターがあなたをお待ちしています</p>
        </div>
        
        <div class="footer-copyright">
          <p>&copy; <span id="current-year"></span> AI PAR - LOVEパートナー. All rights reserved.</p>
        </div>
      </div>
    </footer>
  </div>

  <script>
    async function loadCharacters() {
      try {
        const res = await fetch("./data/characters.json?v=" + Date.now());
        const characters = await res.json();
        const container = document.getElementById("charactersGrid");
        
        // ローディング表示を削除
        container.innerHTML = '';

        characters.forEach(char => {
          const card = document.createElement("div");
          card.className = "character-card";

          const typeLabel = char.type === 'lover' ? '恋人タイプ' :
                            char.type === 'friend' ? '親友タイプ' :
                            char.type === 'advisor' ? '相談相手タイプ' : 'キャラクター';

          card.innerHTML = `
            <div class="character-header">
              <img src="${char.img}" alt="${char.name}" class="character-avatar">
              <div class="character-info">
                <h3 class="character-name">${char.name}</h3>
                <p class="character-age">${char.age_label}・${typeLabel}</p>
              </div>
            </div>
            <p class="character-description">${char.intro || '魅力的なAIキャラクターです。'}</p>
            ${char.phrase ? `<p class="character-phrase">"${char.phrase}"</p>` : ''}
            <div class="character-tags">
              <span class="character-tag">${char.type === 'lover' ? '💕' : char.type === 'friend' ? '🤝' : '💡'} ${typeLabel}</span>
            </div>
            <div class="character-actions">
              <a href="${char.profile}" class="btn btn-primary">プロフィール</a>
              <a href="./chat.html?character=${char.name}" class="btn btn-secondary">チャット</a>
            </div>
          `;

          container.appendChild(card);
        });
      } catch (err) {
        console.error("キャラクター一覧の読み込みに失敗しました", err);
        const container = document.getElementById("charactersGrid");
        container.innerHTML = '<div style="text-align: center; padding: 40px; color: #666;"><p>キャラクター情報の読み込みに失敗しました。</p><p>しばらく時間をおいてから再度お試しください。</p></div>';
      }
    }

    // 現在の年を表示
    document.getElementById('current-year').textContent = new Date().getFullYear();

    window.onload = loadCharacters;
  </script>
</body>
</html>
