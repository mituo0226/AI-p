    body {

      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #333;
    }

    .logo img {
      height: 40px;
      width: auto;
    }

    .logo-text {
      font-size: 20px;
      font-weight: bold;
      background: linear-gradient(45deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav a {
      text-decoration: none;
      color: #333;
      padding: 8px 15px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.8);
      transition: all 0.3s ease;
      font-weight: 500;
      font-size: 14px;
      white-space: nowrap;
    }

    .nav a:hover {
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white;
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
    }

    /* Main Content */
    .main-content {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 25px 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .hero-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .hero-section h1 {
      font-size: 2.2rem;
      margin-bottom: 15px;
      color: #333;
      background: linear-gradient(45deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-section p {
      font-size: 1rem;
      color: #666;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .characters-icon {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    /* Search Section */
    .search-section {
      margin-bottom: 30px;
    }

    .search-container {
      position: relative;
      max-width: 400px;
      margin: 0 auto;
    }

    .search-input {
      width: 100%;
      padding: 12px 45px 12px 15px;
      border: 2px solid #e1e5e9;
      border-radius: 25px;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: white;
    }

    .search-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .search-icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #666;
      font-size: 1.2rem;
    }

    /* Characters Grid */
    .characters-grid {

      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 30px;

    .character-card {

      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .character-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      border-color: #667eea;
    }

    .character-header {

      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .character-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #fff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);

    .character-description {

    .character-tag {

      color: white;
      padding: 4px 12px;
      border-radius: 15px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .character-actions {
      display: flex;
      gap: 10px;

    .btn {

      font-weight: bold;
      cursor: pointer;

      height: 30px;

    @keyframes spin {

    // キャラクターカードを生成
    function createCharacterCard(character) {
      return `
        <div class="character-card" data-character="${character.id}">
          <div class="character-header">
            <img src="${character.image}" alt="${character.name}" class="character-avatar">
            <div class="character-info">
              <div class="character-name">${character.name}</div>
              <div class="character-title">${character.title}</div>
              <div class="character-age">${character.age}</div>
            </div>
          </div>
          <div class="character-description">${character.description}</div>
          <div class="character-tags">
            ${character.tags.map(tag => `<span class="character-tag">${tag}</span>`).join('')}
          </div>
          <div class="character-actions">
            <a href="./profile/${character.id}.html" class="btn btn-secondary">プロフィール</a>
            <a href="./chat.html?char=${character.id}&name=あなた" class="btn btn-primary">チャット開始</a>
          </div>
        </div>
      `;
    }

    // キャラクター一覧を表示
    function displayCharacters(charactersToShow) {
      const grid = document.getElementById('charactersGrid');
      const noResults = document.getElementById('noResults');
      
      if (charactersToShow.length === 0) {
        grid.style.display = 'none';
        noResults.style.display = 'block';
      } else {
        grid.style.display = 'grid';
        noResults.style.display = 'none';
        grid.innerHTML = charactersToShow.map(createCharacterCard).join('');
      }
    }

    // 検索機能
    function filterCharacters(searchTerm) {
      const filtered = characters.filter(character => 
        character.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
        character.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
        character.tags.some(tag => tag.toLowerCase().includes(searchTerm.toLowerCase()))
      );
      displayCharacters(filtered);
    }

      // 検索機能
      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', function() {
        filterCharacters(this.value);
      });
      
      // モバイルでのタッチ操作を改善
      if ('ontouchstart' in window) {
        const touchElements = document.querySelectorAll('.character-card, .nav a, .btn');
        touchElements.forEach(element => {
          element.style.transition = 'none';
        });
      }
    });
  </script>
</body>
</html>
