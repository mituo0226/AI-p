<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI PAR｜キャラクター一覧</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    body{-webkit-font-smoothing:antialiased}
    .wrap{max-width:960px;margin:0 auto;padding:20px}
    .brand{display:flex;align-items:center;gap:12px}
    .brand img{display:block;height:40px;width:auto}
    @media (max-width:640px){.brand img{height:32px}}
    header.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .nav{display:flex;gap:12px}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin:12px 0}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media (max-width:820px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">

<header aria-label="サイトヘッダー" class="header">
  <a class="brand" href="./index.html" aria-label="AI PAR トップへ">
    <picture>
      <source srcset="./image/material/rogo-320.webp 320w, ./image/material/rogo-640.webp 640w, ./image/material/rogo-960.webp 960w, ./image/material/rogo-1280.webp 1280w" type="image/webp">
      <img
        src="./image/material/rogo.png"
        srcset="./image/material/rogo-320.png 320w, ./image/material/rogo-640.png 640w, ./image/material/rogo-960.png 960w, ./image/material/rogo-1280.png 1280w"
        sizes="(max-width: 640px) 160px, 220px"
        alt="AI PAR｜LOVEパートナー ロゴ"
        width="220" height="auto" decoding="async" loading="eager">
    </picture>
  </a>
  <nav aria-label="ナビゲーション" class="nav">
    <a href="./index.html">トップ</a>
    <a href="./matching.html">キャラクター一覧</a>
    <a href="./questionnaire.html">診断</a>
  </nav>
</header>

<main aria-label="キャラクター一覧">
  <section class="card">
    <h1>キャラクター一覧</h1>
    <p>診断結果に関係なく、気になる相手のプロフィールをチェックできます。</p>
    <img src="./itiran-rogo.png" alt="一覧ページ用バナー" style="max-width:100%;height:auto;margin-top:8px">
  </section>

  <section class="grid">
    <div class="card">
      <h2>プロフィールへ</h2>
      <p>一人ずつ詳しいページをご用意しています。</p>
      <p><a href="./prof.html">サンプルプロフィールを見る</a></p>
    </div>
    <div class="card">
      <h2>診断をやり直す</h2>
      <p><a href="./questionnaire.html">診断ページへ</a></p>
    </div>
  </section>
</main>

<footer style="margin-top:24px;padding-top:12px;border-top:1px solid #e5e7eb;font-size:.9rem;color:#6b7280">
      © <span id="y"></span> AI PAR
    </footer>
  </div>
  <script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
